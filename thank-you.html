<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Дякуємо за заявку | Dimkomfortu</title>
    <meta
      name="description"
      content="Дякуємо за звернення. Ми вже отримали вашу заявку, очікуйте дзвінок від менеджера протягом 10 хвилин."
    />
    <meta name="robots" content="noindex, follow" />
    <link rel="canonical" href="https://www.dimkomfortu.kyiv.ua/thank-you" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-48x48.png" sizes="48x48" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script>
      function resolveThankMode() {
        const queryMode = new URLSearchParams(window.location.search).get("mode");
        if (queryMode === "conditioners" || queryMode === "windows") return queryMode;

        try {
          const savedMode = window.localStorage.getItem("comfort-climate-mode");
          if (savedMode === "conditioners" || savedMode === "windows") return savedMode;
        } catch (error) {
          // Ignore storage issues.
        }

        return document.referrer.includes("/conditioners") ? "conditioners" : "windows";
      }

      window.__thankPageMode = resolveThankMode();
      window.dataLayer = window.dataLayer || [];
      window.dataLayer.push({
        event: "lead_thank_you",
        page_type: "thank_you",
        mode: window.__thankPageMode
      });
    </script>
  </head>
  <body data-page-mode="windows" class="mode-windows">
    <script>
      document.body.dataset.pageMode = window.__thankPageMode;
      document.body.classList.remove("mode-windows", "mode-conditioners");
      document.body.classList.add(`mode-${window.__thankPageMode}`);
    </script>
    <main class="thank-page">
      <section class="thank-card">
        <img class="thank-logo" src="/assets/img/logo.svg?v=20260724-readable-tagline" alt="Dimkomfortu" />
        <p class="section-label thank-status">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 6 9 17l-5-5" />
          </svg>
          <span>Заявку отримано</span>
        </p>
        <h1>Дякуємо за звернення!</h1>
        <p>
          Ми вже отримали вашу заявку.<br />
          Очікуйте дзвінок від менеджера<br />
          протягом 10 хвилин для уточнення<br />
          деталей.<br />
          Дякуємо, що обрали «Дім Комфорту»!
        </p>
        <div class="thank-actions">
          <a class="cta-button" href="/" data-thank-return>
            <span class="button-label">Повернутися на сайт</span>
          </a>
        </div>
      </section>
    </main>
    <script>
      const thankReturnLink = document.querySelector("[data-thank-return]");
      if (thankReturnLink) {
        thankReturnLink.setAttribute("href", window.__thankPageMode === "conditioners" ? "/conditioners/" : "/");
      }
    </script>
  </body>
</html>
